[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-security"
version = "0.1.0"
description = "FastAPI experiment management platform for agent SFT experiments"
requires-python = "==3.10.13"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlmodel>=0.0.16",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Training/eval side deps (torch & friends). Install on GPU servers only.
sft = [
    "torch>=2.3.0",
    "transformers>=4.51.0,<5",
    "datasets>=3.0.0",
    "peft>=0.15.0",
    "accelerate>=1.2.0",
    "safetensors>=0.4.5",
]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["agents*", "app*", "daemon*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
